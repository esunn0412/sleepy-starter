# The seat cluster: a private, throwaway Kubernetes control plane (etcd, kube-apiserver,
# kube-scheduler, KWOK) in one pod. Rooms are its fake Nodes and attendees are its Pods,
# so attendee Pods never reach the vcluster or the host cluster. Only the app talks to it,
# inside the namespace, on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seats
  labels:
    app: seats
spec:
  replicas: 1
  # Its state is disposable (the app re-seeds rooms on start), so replace it, never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seats
  template:
    metadata:
      labels:
        app: seats
    spec:
      # A self-contained control plane: it never calls the team cluster's API.
      automountServiceAccountToken: false
      containers:
        - name: seats
          image: registry.k8s.io/kwok/cluster:v0.8.0-k8s.v1.34.8
          ports:
            - name: kube-api
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1500m"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: kube-api
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: kube-api
            periodSeconds: 10
          # Restart the control plane if its apiserver stops answering; the app
          # re-seeds the rooms within 30 s.
          livenessProbe:
            tcpSocket:
              port: kube-api
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: seats
  labels:
    app: seats
spec:
  selector:
    app: seats
  ports:
    - name: kube-api
      port: 8080
      targetPort: kube-api
---
# The seat apiserver is plain HTTP with no auth (KWOK's insecure port): only the
# app's pods may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seats
spec:
  podSelector:
    matchLabels:
      app: seats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app
      ports:
        - port: 8080
