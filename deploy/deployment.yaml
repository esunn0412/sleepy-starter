apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "sleepy"
            - name: SEATS_URL
              value: "http://seats:8080"
            # From the app-credentials Secret (created in Radar, never in git).
            # Optional: without it the organizer controls stay disabled.
            - name: ORGANIZER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: organizer-token
                  optional: true
            # OpenTelemetry → Dash0 (OTLP/HTTP). Endpoint and token come from the
            # app-credentials Secret; without them telemetry stays off.
            - name: DASH0_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-endpoint
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-auth-token
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: "kubeseat"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "$(DASH0_ENDPOINT)"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "Authorization=Bearer%20$(DASH0_AUTH_TOKEN)"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=team-sleepy,deployment.environment.name=hackathon,k8s.namespace.name=team-sleepy,k8s.deployment.name=app,k8s.pod.name=$(POD_NAME)"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
